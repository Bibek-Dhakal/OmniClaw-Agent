services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniclaw
      POSTGRES_DB: omniclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U omniclaw -d omniclaw" ]
      interval: 5s
      timeout: 3s
      retries: 10

  omniclaw:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://omniclaw:${POSTGRES_PASSWORD:-change-me}@postgres:5432/omniclaw
      BROWSER_STATE_DIR: /data/browser_state
    ports:
      - "8080:8080"
    volumes:
      - ./.browser_state:/data/browser_state
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: